spring:
  application:
    name: auxia-backend
  config:
    # Local development: DB_* variables can live in a .env file (never committed).
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  autoconfigure:
    # No in-memory user with a generated password: Identity Access will provide the users.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  messages:
    basename: messages
    encoding: UTF-8
    # Unsupported languages get English, never the language of the server.
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Neon suspends its compute when no connection is open, and bills the time it is awake.
      # Idle connections close after a minute, so the database sleeps while nobody uses the API.
      minimum-idle: 0
      idle-timeout: 60000
      maximum-pool-size: 5
  flyway:
    # One schema per bounded context; the history table lives in public.
    schemas: emergency_management, resource_management, traceability, identity_access, citizen_transparency
    default-schema: public
    # Neon already had the schema of V1 when Flyway was added: on that database V1 is recorded
    # as the baseline instead of running. An empty database runs every migration from V1.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: schema of the project report
  servlet:
    multipart:
      # Evidence of a delivery (TS-05): a few photos or documents per registration.
      max-file-size: 10MB
      max-request-size: 50MB
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate

auxia:
  web:
    # Origins of the web application allowed to call the API from the browser (CORS), separated
    # by commas. Locally, the Vite and Next.js dev servers.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  security:
    # Secret of the platform operator to register and suspend organizations (X-Platform-Key).
    platform-admin-key: ${PLATFORM_ADMIN_KEY}
    jwt:
      # Base64 secrets of at least 32 bytes by key id. To rotate, add a key and make it active.
      keys:
        k1: ${AUTH_JWT_SECRET}
      active-key-id: k1
      expiration: 8h
  ai-service:
    # auxia-ai-service structures field reports and calculates urgency scores (TS-C04).
    # Its key must be the same AI_SERVICE_API_KEY that the AI Service expects.
    base-url: ${AI_SERVICE_URL:http://localhost:8765}
    api-key: ${AI_SERVICE_API_KEY}
  sinpad:
    # SINPAD of INDECI has no public API: by default the field reports go by HTTP to the SINPAD
    # simulator of this same backend (/sinpad-simulator). SINPAD_URL points to another service.
    base-url: ${SINPAD_URL:http://localhost:${server.port:8080}/sinpad-simulator}
    # Key of AuxIA in SINPAD; the simulator expects the same one.
    api-key: ${SINPAD_API_KEY:sinpad-simulator-local-key}
    simulator:
      enabled: ${SINPAD_SIMULATOR_ENABLED:true}
  citizen-reports:
    # SOS of citizens without signing in (POST /api/v1/public/field-reports). In a disaster many
    # people share an address (mobile operator NAT, the Wi-Fi of a shelter), so the limit is
    # generous. A retry of an SOS already stored does not count.
    rate-limit:
      max-reports: ${SOS_RATE_LIMIT_MAX_REPORTS:10}
      window: ${SOS_RATE_LIMIT_WINDOW:10m}
    # SOS that a phone uploads for its neighbors after receiving them by Mesh (A_05, A_06): one
    # phone with signal sends the SOS of many, so they count apart in a wider limit.
    relay-rate-limit:
      max-reports: ${SOS_RELAY_RATE_LIMIT_MAX_REPORTS:60}
      window: ${SOS_RELAY_RATE_LIMIT_WINDOW:10m}
    # Private container of the photos and audios of the SOS, in the account of the evidence.
    attachments-container: ${SOS_ATTACHMENTS_CONTAINER:sos-attachments}
  brigade-registrations:
    # Private container of the photos of the cards of the brigadists that register (A_02).
    id-cards-container: ${BRIGADE_ID_CARDS_CONTAINER:brigade-id-cards}
  evidence-storage:
    # Azure Blob Storage, or Azurite for local development (see the README).
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING}
    container: ${AZURE_STORAGE_CONTAINER:evidences}
  blockchain:
    # DeliveryRegistry on Sepolia (auxia-smart-contracts/deployments/sepolia.json). The private
    # key is the one of the wallet that owns the contract: only it can register deliveries.
    rpc-url: ${BLOCKCHAIN_RPC_URL}
    private-key: ${BLOCKCHAIN_PRIVATE_KEY}
    contract-address: ${BLOCKCHAIN_CONTRACT_ADDRESS:0xe678347E182cbf00031401C97284AaB1C6b8148c}
    chain-id: ${BLOCKCHAIN_CHAIN_ID:11155111}
    # Block explorer of the network, linked from the e-mail of a certified delivery.
    explorer-url: ${BLOCKCHAIN_EXPLORER_URL:https://sepolia.etherscan.io}
  traceability:
    anchoring:
      # In the background, so the brigade does not wait for a block.
      asynchronous: true
      # Deliveries not anchored yet are tried again this often, up to max-attempts transactions.
      retry-enabled: true
      retry-interval: 5m
      max-attempts: 10
  notifications:
    email:
      # Notification Service: e-mails through any SMTP server with STARTTLS, such as Gmail with an
      # app password. Without MAIL_HOST, or with MAIL_ENABLED=false, they are only logged.
      enabled: ${MAIL_ENABLED:true}
      host: ${MAIL_HOST:}
      port: ${MAIL_PORT:587}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      from: ${MAIL_FROM:}
      # The users of AuxIA read Spanish.
      language: ${NOTIFICATIONS_LANGUAGE:es-419}

info:
  app:
    name: AuxIA Backend API
    version: '@project.version@'

springdoc:
  # On in every profile, prod included: the deployed API is tried from Swagger UI.
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    # The JDK HTTP client sets Content-Length by itself, and the Azure SDK warns on every
    # request that it cannot set it. The files are stored correctly.
    com.azure.core.http.jdk.httpclient.JdkHttpClient: error

management:
  endpoints:
    web:
      exposure:
        include: health, info
  info:
    env:
      enabled: true

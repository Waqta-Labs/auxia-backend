spring:
  application:
    name: auxia-backend
  config:
    # Local development: DB_* variables can live in a .env file (never committed).
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  autoconfigure:
    # No in-memory user with a generated password: Identity Access will provide the users.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

info:
  app:
    name: AuxIA Backend API
    version: '@project.version@'

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health, info
  info:
    env:
      enabled: true
